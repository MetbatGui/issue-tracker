name: issue-tracker

services:
  issue-tracker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: issue-tracker:latest
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      # OAuth refresh token은 실행 중 갱신되므로 secrets 디렉터리는 쓰기 가능해야 한다.
      - ../secrets:/app/secrets
      - ../.env:/app/.env:ro
    environment:
      TZ: Asia/Seoul

  issue-tracker-cron:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: issue-tracker:latest
    entrypoint: ["/app/docker/cron-entrypoint.sh"]
    user: root
    restart: unless-stopped
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      # 다른 크롤러 프로젝트와 동일하게 token.json 갱신을 위해 쓰기 가능하게 마운트한다.
      - ../secrets:/app/secrets
      - ../.env:/app/.env:ro
    environment:
      TZ: Asia/Seoul
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
